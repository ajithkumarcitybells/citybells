<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FACC15" />
    <title>City Taxi Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 24px;
      }
      main {
        width: min(420px, 100%);
        border: 1px solid #e2e8f0;
        border-radius: 28px;
        background: white;
        padding: 28px;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
      }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: #fef3c7;
        color: #92400e;
        font-size: 18px;
        font-weight: 900;
      }
      h1 { margin: 18px 0 8px; font-size: 26px; }
      p { margin: 0; color: #64748b; line-height: 1.5; }
      a {
        margin-top: 22px;
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: #020617;
        color: white;
        padding: 0 18px;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">TAXI</div>
      <h1>City Taxi is offline</h1>
      <p>Your taxi app shell is saved on this device. Reconnect to refresh maps, fares and ride requests.</p>
      <a href="/taxi">Back to taxi</a>
    </main>
  </body>
</html>
